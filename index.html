<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo da Matematica</title>
    <link rel="stylesheet" href="styles.css?v=center-1" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Bingo da matematica</p>
        <h1>Operacoes simples com os numeros dos teus cartoes.</h1>
      </div>
      <div class="header-actions">
        <button id="chooseCardsTop" class="ghost-button" type="button">Escolher cartoes</button>
        <button id="newGameTop" class="ghost-button" type="button">Novo jogo</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="setup-panel" aria-labelledby="setup-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">1. Escolher cartoes</p>
            <h2 id="setup-title">Selecionar numeros</h2>
          </div>
          <span id="setupStatus" class="counter">0/15</span>
        </div>

        <div class="card-count-panel">
          <span>Quantos cartoes?</span>
          <div id="cardCountPicker" class="segmented-control" aria-label="Quantidade de cartoes"></div>
        </div>

        <div id="setupCards" class="setup-cards"></div>

        <button id="startGame" class="primary-button wide-button" type="button" disabled>Iniciar jogo</button>
      </section>

      <section class="game-panel" aria-labelledby="game-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">2. Jogada</p>
            <h2 id="game-title">Conta da vez</h2>
          </div>
          <span id="remainingCount" class="counter">0 numeros</span>
        </div>

        <div id="winnerBanner" class="winner-banner" hidden></div>

        <div class="game-board">
          <div id="statusText" class="status-text">Escolhe os numeros dos cartoes para comecar.</div>
          <div id="question" class="question" aria-live="assertive">?</div>
          <div id="answer" class="answer" hidden></div>
          <div class="game-actions">
            <button id="chooseCards" class="ghost-button" type="button">Escolher cartoes</button>
            <button id="newOperation" class="primary-button" type="button" disabled>Nova operacao</button>
            <button id="showAnswer" class="secondary-button" type="button" disabled>Mostrar resultado</button>
            <button id="newGame" class="ghost-button" type="button">Novo jogo</button>
          </div>
        </div>
      </section>
    </main>

    <section class="cards-area" aria-labelledby="play-cards-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">3. Cartoes</p>
          <h2 id="play-cards-title">Cartoes em jogo</h2>
        </div>
      </div>
      <div id="playCards" class="play-cards"></div>
    </section>

    <section class="history-area" aria-labelledby="history-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">4. Numeros</p>
          <h2 id="history-title">Numeros que sairam</h2>
        </div>
      </div>
      <div id="calledNumbers" class="called-numbers"></div>
      <div id="historyList" class="history-list"></div>
    </section>

    <script src="app.js?v=mult-1"></script>
  </body>
</html>
